<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Test IndexedDB 2.2</title><style>body{font:16px system-ui;max-width:750px;margin:50px auto;padding:20px;color:#102a43}button{padding:12px;margin:5px;background:#102a43;color:white;border:0;border-radius:7px}pre{white-space:pre-wrap;line-height:1.6}</style><h1>Diagnostyka pamięci IWE Trener 2.2</h1><p>Test korzysta z oddzielnej bazy IndexedDB i nie modyfikuje wyników nauki.</p><button id="start">Uruchom test 75 000 i 150 000 odpowiedzi</button><button id="verify">Sprawdź zapis po odświeżeniu</button><pre id="results"></pre><script>
const DB='iweTrainer22StorageDiagnosticV1',out=document.querySelector('#results');function log(s){out.textContent+=s+'\n'}
function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>req.result.createObjectStore('snapshots');req.onerror=()=>reject(req.error);req.onsuccess=()=>resolve(req.result)})}
async function write(v){const db=await openDb();try{await new Promise((resolve,reject)=>{const tx=db.transaction('snapshots','readwrite');tx.objectStore('snapshots').put(v,'current');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}finally{db.close()}}
async function read(){const db=await openDb();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('snapshots','readonly'),req=tx.objectStore('snapshots').get('current');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}finally{db.close()}}
async function check(n){const h=Array.from({length:n},(_,i)=>({eventId:'event-'+i,sessionId:'session-'+Math.floor(i/50),id:'q'+(i%1200),date:'2026-10-26T13:00:00Z',correct:i%3!==0,mode:'learn',module:'I',localDay:'2026-10-26'}));const p={byId:{},history:h,examHistory:[],sessionHistory:[],answered:n,sessions:0},bytes=new Blob([JSON.stringify(p)]).size,t=performance.now();await write(p);const q=await read();if(q.history.length!==n||q.history[n-1].eventId!=='event-'+(n-1))throw Error('Nieprawidłowy odczyt '+n);log('OK: '+n+' odpowiedzi; '+(bytes/1048576).toFixed(2)+' MiB; '+Math.round(performance.now()-t)+' ms')}
document.querySelector('#start').onclick=async()=>{out.textContent='';document.querySelector('#start').disabled=true;try{await check(75000);await check(150000);log('Odśwież stronę, następnie kliknij sprawdzenie trwałości.')}catch(e){log('BŁĄD: '+e.message)}finally{document.querySelector('#start').disabled=false}};
document.querySelector('#verify').onclick=async()=>{try{const p=await read(),ok=p?.history?.length===150000&&p.history[149999].eventId==='event-149999';log(ok?'OK: po odświeżeniu zachowano 150 000 odpowiedzi':'BŁĄD: odczytano '+(p?.history?.length??0)+' odpowiedzi')}catch(e){log('BŁĄD: '+e.message)}};
</script></html>
